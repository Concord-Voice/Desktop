<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP chain for the desktop SPA:
        1. services/control-plane/internal/middleware/security.go sets a strict
           default-src 'none' Content-Security-Policy header globally.
        2. services/control-plane/internal/spa/handler.go:80-84 deletes that
           header on SPA asset responses, so the meta tag below is authoritative
           for the renderer.
        3. Cloudflare's Free-tier baseline bot-intelligence layer injects a
           JSD beacon (<script src="/cdn-cgi/challenge-platform/scripts/jsd/main.js">)
           plus an Email-Obfuscation decoy anchor (/cdn-cgi/content?id=...) into
           HTML responses served through the CF edge on CF-proxied paths
           matching the /api/* heuristic. This CSP — script-src-elem 'self'
           'wasm-unsafe-eval' with no 'unsafe-inline' — blocks the beacon as
           designed. The injection is NOT from Web Analytics Auto Inject, Bot
           Fight Mode, Page Shield, Email Obfuscation, or RUM — all were
           toggled off via a Configuration Rule scoped to the SPA path during
           the #725 investigation and the injection persisted. It comes from
           Cloudflare's always-on Free-tier classification pipeline with no
           customer-exposed opt-out. The fix (shipped in #725) is to serve the
           SPA from a non-/api/* path (/spa/<sha7>/index.html) so the path
           heuristic does not fire. See #725 and
           internal-reference for
           the full elimination chain.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self' 'wasm-unsafe-eval';
                   script-src-elem 'self' 'wasm-unsafe-eval';
                   style-src 'self' 'unsafe-inline';
                   connect-src 'self' ws://localhost:* http://localhost:* wss://localhost:* https://localhost:* ws://127.0.0.1:* http://127.0.0.1:* https://concordvoice.chat wss://concordvoice.chat https://*.concordvoice.chat wss://*.concordvoice.chat;
                   img-src 'self' data: blob: https://cdn.jsdelivr.net;
                   media-src 'self' blob:;
                   base-uri 'self';
                   form-action 'self';">
    <title>Concord Voice</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
  </body>
</html>
