      - name: Upload artifacts (Windows)
        if: matrix.platform == 'win32'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concord-voice-${{ matrix.label }}-v${{ needs.detect-release.outputs.version }}
          # NSIS writes directly into `directories.output` (= Forge's makeDir,
          # `out/make`), NOT into a maker subdirectory — the `squirrel.windows/`
          # path this used before #2402 no longer exists. Scoped to the installer
          # rather than `out/make/**/*` so a stray electron-builder `latest.yml`
          # cannot collide by basename with the canonical one the release job
          # generates.
          path: desktop/out/make/*Setup.exe
          # Load-bearing: the default is `warn`, so a path that matches nothing
          # uploads zero files and the SIGNED build leg still goes green — the
          # failure would surface much later as a missing *windows-*-Setup.exe in
          # assert-binary-asset-set, at which point trimming required_assets looks
          # like the fix and would ship a Windows-less release. Fail here instead.
          if-no-files-found: error
          retention-days: 7 # #643: GitHub Release persists binaries; shrink signed-artifact exposure window

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concord-voice-${{ matrix.label }}-v${{ needs.detect-release.outputs.version }}
          # Both .zip (auto-update payload, consumed by electron-updater via
          # latest-mac.yml) AND .dmg (first-install installer, #1159 Phase 1)
          # are published. Same artifact bundle name — both flow through to
          # sync-releases.yml's gh release download + rsync.
          path: |
            desktop/out/make/zip/darwin/**/*.zip
            desktop/out/make/**/*.dmg
            desktop/out/make/zip/darwin/**/*.zip.sha512
            desktop/out/make/**/*.dmg.sha512
          retention-days: 7 # #643: GitHub Release persists binaries; shrink signed-artifact exposure window

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: concord-voice-${{ matrix.label }}-v${{ needs.detect-release.outputs.version }}
          path: |
            desktop/out/make/deb/**/*.deb
            desktop/out/make/rpm/**/*.rpm
            desktop/out/make/**/*.AppImage
          retention-days: 7 # #643: GitHub Release persists binaries; shrink signed-artifact exposure window

