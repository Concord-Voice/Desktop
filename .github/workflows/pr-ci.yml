name: PR CI

# PR-time CI orchestrator (#919 §5.2). Calls build.yml via workflow_call to
# run the PR-time suite. The live org baseline ruleset (17153062) requires
# Gitar and SonarCloud Code Analysis; the live Alpha ruleset (17541948)
# requires per-tool code-scanning analyses. The trusted required build
# workflow is sourced from protected main by an Alpha-only organization
# ruleset (24957423), which also requires `Required PR build result` to be
# current once internal-reference has been applied.
# The Go lint, static-guards, and workflow-lint jobs remain advisory; the West
# deployment-access lab is required when deployment inputs change. It also
# runs the SPA-deploy contract verifier
# (`verify-spa-env.sh --mode=pr`), and exercises the deploy scripts in
# --dry-run mode against the staging target (Invariant 2: PR runners cannot
# resolve production-scoped secrets, so dry-runs against staging are the only
# safe rehearsal of script logic before merge).
#
# Spec: internal-reference §5.2

on:
  workflow_call:
    inputs:
      trusted-source:
        description: "Load policy from the immutable protected workflow source"
        type: boolean
        required: false
        default: false
      enforcement-only:
        description: "Run only the scanner/build DAG owned by the protected verdict"
        type: boolean
        required: false
        default: false
    outputs:
      report-selection:
        description: "Protected scan selection JSON"
        value: ${{ jobs.report.outputs.selection }}
      report-jobs:
        description: "Actual scanner and build job results"
        value: ${{ jobs.report.outputs.jobs }}
      coverage-uploads:
        description: "Actual build coverage upload flags"
        value: ${{ jobs.report.outputs.coverage-uploads }}
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read
  packages: read
  security-events: write
  # NO `environment: production` on any job — Invariant 2: PR runners cannot
  # resolve production-scoped secrets, so dry-run deploys hit staging only.

concurrency:
  # Title/body-only edits must not cancel a real run on the same head. A base
  # retarget (or an edited event with unknown changes) still gets ordinary CI.
  group: ${{ inputs.enforcement-only && format('pr-ci-protected-{0}', github.event.pull_request.number) || (github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null) && format('pr-ci-metadata-{0}', github.event.pull_request.number) || format('pr-ci-ordinary-{0}', github.event.pull_request.number)) }}
  cancel-in-progress: ${{ !inputs.enforcement-only }}

jobs:
  # ─── Supply-chain IOC gate (IOC-first invariant, ADR-0018 / #1472) ───
  # MUST be the first node: every subsequent reusable invocation that
  # installs or executes repo code carries `needs: ioc`, so no dependency
  # install can begin before the IOC verdict. This single structural edge
  # replaces the five per-job `needs: supply-chain-scan` edges that
  # previously lived inside build.yml.
  ioc:
    if: ${{ inputs.enforcement-only || !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    name: ioc
    uses: ./.github/workflows/ioc-scanning.yml
    with:
      trusted-source: ${{ inputs.trusted-source == true }}
    permissions:
      contents: read
      pull-requests: read  # dorny/paths-filter lists changed files

  # ─── PR-time suite (build.yml via workflow_call) ───────────────────────
  # Spec §6 row 6 — workflow_call invocation. build.yml's workflow_call
  # declaration keeps coverage outputs available to the protected caller.
  build:
    name: build
    needs: [ioc, detect-changes]
    if: ${{ !cancelled() && needs.ioc.result == 'success' && (inputs.enforcement-only || needs.detect-changes.outputs.protected-owner != 'true') }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build.yml
    # Pass the unified detect-changes union so build.yml skips its duplicate
    # `changes` detection steps (2026-07 CI deep-dive: three detects -> one).
    # detect-changes is a ~10s API-only job (no repo-code install/exec) that
    # finishes well before ioc, so this adds no critical-path latency and does
    # not weaken the IOC-first invariant (build.yml's dependency-installing jobs
    # still carry `needs: ioc` via this node). On push:main main-ci.yml passes
    # nothing, so build.yml computes the filter locally as before.
    with:
      desktop-changed: ${{ needs.detect-changes.outputs.desktop }}
      control-plane-changed: ${{ needs.detect-changes.outputs.control-plane }}
      media-plane-changed: ${{ needs.detect-changes.outputs.media-plane }}
      media-plane-tests-changed: ${{ needs.detect-changes.outputs.media-plane-tests }}
      admin-changed: ${{ needs.detect-changes.outputs.admin }}
      production-docker-changed: ${{ needs.detect-changes.outputs.production-docker }}
      force-coverage: ${{ inputs.trusted-source == true && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.scan-known == 'true' && fromJSON(needs.detect-changes.outputs.scan-selection).coverage_required.desktop }}

  # ─── concord-dev unit/smoke suite + buildtools age (#1475) ───────────
  # Orchestrated (not standalone): the native smoke installs repo
  # dependencies via concord-dev.sh, so the IOC-first invariant applies.
  # D: server, deployment and admin code belongs to Self-Hosted / Hosted. Removed unit-smoke.
  semgrep:
    name: semgrep
    needs: [ioc, detect-changes]
    if: >-
      !cancelled() && needs.ioc.result == 'success' &&
      (inputs.enforcement-only || needs.detect-changes.outputs.protected-owner != 'true') &&
      (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).selected.semgrep_custom || fromJSON(needs.detect-changes.outputs.scan-selection).selected.semgrep_community || fromJSON(needs.detect-changes.outputs.scan-selection).selected.semgrep_canary)
    permissions:
      contents: read
      pull-requests: write  # findings summary comment
      security-events: write
      actions: read
    uses: ./.github/workflows/semgrep.yml
    with:
      external-verdict: ${{ inputs.enforcement-only == true }}
      run-custom: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).selected.semgrep_custom }}
      run-community: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).selected.semgrep_community }}
      run-canary: ${{ needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).selected.semgrep_canary }}

  eslint:
    name: eslint
    needs: [ioc, detect-changes]
    if: >-
      !cancelled() && needs.ioc.result == 'success' &&
      (inputs.enforcement-only || needs.detect-changes.outputs.protected-owner != 'true') &&
      (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).selected.eslint)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/eslint-sarif.yml
    with:
      external-verdict: ${{ inputs.enforcement-only == true }}

  # D: server, deployment and admin code belongs to Self-Hosted / Hosted. Removed govulncheck.
  secret-scanning:
    name: secret-scanning
    needs: [ioc]
    if: ${{ !inputs.enforcement-only }}
    permissions:
      contents: read
    uses: ./.github/workflows/secret-scanning.yml

  # ─── Go lint (golangci-lint) — ADVISORY ──────────────────────────────
  # No workflow ran golangci-lint between #373 (2026-03-24, which deleted the
  # golangci-lint-action step) and this job, so the pre-commit hook was the
  # only gate and a commit made without hooks reached main unlinted (#3368's
  # staticcheck SA1012, later suppressed by #3402).
  #
  # It stays separate from build.yml so a build failure does not hide this
  # advisory lint verdict.
  #
  # The version is READ from .pre-commit-config.yaml so the local and CI gates
  # cannot drift. `go install` rather than a prebuilt binary or
  # golangci-lint-action: it is how pre-commit's `language: golang` hook builds
  # the same rev, it adds no third-party action, and the module proxy + sumdb
  # make a version pin supply-chain-equivalent to a SHA pin (govulncheck.yml).
  # Whole module, never --new-from-*: `golangci-lint run ./...` is 0 issues on
  # main, so any finding is one this PR introduced or a rev bump surfaced.
  # D: server, deployment and admin code belongs to Self-Hosted / Hosted. Removed golangci-lint.
  native-audiocap:
    name: native-audiocap
    needs: [ioc, detect-changes]
    if: ${{ !inputs.enforcement-only && needs.detect-changes.outputs.native == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/native-audiocap.yml

  # Trivy CVE scan of the built service images (container-image-scan.yml).
  # `needs: ioc` is load-bearing for the same reason as native-audiocap: the
  # media-plane build runs `npm ci` (ADR-0018). Path-gated on the same
  # production-docker filter as the cache-cold compose build. Not a ruleset-
  # required context itself, and a skip never strands a PR, but a FAILURE
  # fails pr-ci and so blocks "Required PR build result", which reads
  # needs.pr-ci.result: a fixable HIGH/CRITICAL finding, or a scan that saw no
  # OS packages, blocks any PR on this path.
  # D: server, deployment and admin code belongs to Self-Hosted / Hosted. Removed container-image-scan.
  # D: server, deployment and admin code belongs to Self-Hosted / Hosted. Removed west-deployment-lab.
  # D: server, deployment and admin code belongs to Self-Hosted / Hosted. Removed managed-firewall.
  static-guards:
    name: static-guards
    needs: [ioc, detect-changes]
    # internal-reference P3/P8.5: !cancelled()
    # removes default needs-success chaining so detector failure is conservative;
    # explicit IOC success still precedes every repository-code execution.
    if: ${{ !inputs.enforcement-only && !cancelled() && needs.ioc.result == 'success' && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).hotfix || fromJSON(needs.detect-changes.outputs.scan-selection).advisory.static_guards || needs.detect-changes.outputs.spa == 'true' || needs.detect-changes.outputs.services == 'true') }}
    # ADR-0016: relevant or uncertain self-host work includes CPU-bound Docker
    # fixtures; confirmed unrelated lint/verify work stays on the 2-vCPU tier.
    runs-on: ${{ (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.selfhost != 'false') && 'blacksmith-4vcpu-ubuntu-2404' || 'blacksmith-2vcpu-ubuntu-2404' }}
    # The complete deployment suite builds tooling images and runs bounded
    # readiness tests; #3774 set this budget so its fixtures can finish. The
    # managed firewall suite, which used most of it, now runs in its own job.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: verify-spa-env's attribution diff and the
          # compose-manifest coverage lint's `git show f9cadd93^` regression
          # replay (#1246, spec §6.4 D1) both need it; the shallow default
          # cannot resolve the PR base / old blobs.
          fetch-depth: 0
          # Retain small historical inputs after checkout removes credentials,
          # while avoiding the transfer of large historical blobs.
          filter: blob:limit=1m

      # The staging dry runs previously occupied their own sub-minute job.
      # Keep each path gate and run both even if the first fails.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      - name: Ensure PyYAML for static guards
        if: ${{ !cancelled() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).hotfix || fromJSON(needs.detect-changes.outputs.scan-selection).advisory.go_toolchain || needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).hotfix || fromJSON(needs.detect-changes.outputs.scan-selection).advisory.secrets_contract || needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).hotfix || fromJSON(needs.detect-changes.outputs.scan-selection).advisory.dispatch_trust) }}
        run: >-
          python3 -m pip install --user --quiet --disable-pip-version-check --require-hashes --only-binary=:all: -r .github/requirements-pyyaml.txt

      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      - name: Native addon IOC-gate wiring (ADR-0018)
        if: ${{ !cancelled() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).hotfix || fromJSON(needs.detect-changes.outputs.scan-selection).advisory.native_ioc) }}
        run: bash scripts/check-native-ioc-gate.sh

      - name: Test native addon IOC-gate guard (self-test)
        if: ${{ !cancelled() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).hotfix || fromJSON(needs.detect-changes.outputs.scan-selection).advisory.native_ioc) }}
        run: bash scripts/test-check-native-ioc-gate.sh

      # Copilot-mirror drift guard: .github/instructions/claude-<rule>.instructions.md
      # bodies must match their internal-reference<rule>.md canonical. `--fix`
      # regenerates locally.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      - name: Verify CHANGELOG discipline (#1857)
        # `!cancelled()` restores the independence this check had as its own
        # job. Steps inherit an implicit success(), so without it an earlier
        # static-guards failure SKIPS this one — the developer fixes guard A,
        # pushes, and only then learns the changelog is also wrong. Two CI
        # cycles to surface two independent facts, which is exactly the cost
        # the consolidation was meant to save. Nothing was ever bypassable
        # (a failed earlier step still reds the job and blocks merge); what
        # was lost is completeness of signal in one run. Not `always()`: a
        # cancelled run should stay cancelled.
        if: ${{ !cancelled() && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).hotfix || fromJSON(needs.detect-changes.outputs.scan-selection).advisory.changelog) }}
        env:
          # Untrusted inputs pass via env, never inline ${{ }} in run: (#836).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # No step-level path guard. It used to run the script only when
        # package.json / CHANGELOG.md / the script itself changed, which is
        # exactly the set Rule 4 (#2996) must NOT be limited to: Rule 4 fires on
        # a PR that touches desktop/src or a service and touches the
        # changelog not at all, so a guard keyed on changelog-adjacent paths
        # skips precisely the PRs it exists to catch. The script fast-exits
        # internally instead — Rule 4 filters paths itself, and Rule 1 returns
        # on "no desktop version change" — so unconditional execution costs a
        # handful of git invocations, not a job.
        run: bash .github/scripts/verify-changelog.sh

  # ─── Unified change detection (single paths-filter for the whole PR) ──
  # ONE dorny/paths-filter job computes every filter the PR pipeline needs
  # (2026-07 CI deep-dive). The first two outputs gate pr-ci's own dry-run
  # jobs (as before); the remaining six are passed as inputs into build.yml
  # and unit-smoke.yml so those reusable workflows reuse the outputs instead of
  # executing duplicate checkout + paths-filter steps — one filter execution
  # per PR. On PRs
  # dorny/paths-filter reads the changed-file list via the API, so the result is
  # identical regardless of which workflow computes it; a shallow checkout
  # suffices. (main-ci.yml push:main keeps computing filters inside build.yml —
  # it passes no inputs — because push diffs need git history.)
  detect-changes:
    name: detect-changes
    if: ${{ inputs.enforcement-only || !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null)) }}
    # ADR-0013 §2 / ADR-0005 §3: ADR-0016 measured sub-minute parity;
    # 2-vCPU Blacksmith is the half-cost tier for detect/verify work.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # pr-ci-local gates (dry-run-deploy-*)
      services: ${{ steps.filter.outputs.services }}
      spa: ${{ steps.filter.outputs.spa }}
      # Path-gates the self-host fixtures within static-guards.
      selfhost: ${{ steps.filter.outputs.selfhost }}
      # passed into build.yml (mirror its local `changes` filter exactly)
      desktop: ${{ steps.filter.outputs.desktop }}
      control-plane: ${{ steps.filter.outputs.control_plane }}
      media-plane: ${{ steps.filter.outputs.media_plane }}
      media-plane-tests: ${{ steps.filter.outputs.media_plane_tests }}
      admin: ${{ steps.filter.outputs.admin }}
      production-docker: ${{ steps.filter.outputs.production_docker }}
      # passed into unit-smoke.yml (mirror its former `changes` filter exactly)
      dev-stack: ${{ steps.filter.outputs.dev_stack }}
      # gates native-audiocap.yml (ADR-0043)
      native: ${{ steps.filter.outputs.native }}
      # gates the managed-firewall job
      managed-firewall: ${{ steps.firewall-filter.outputs.managed_firewall }}
      # gates the golangci-lint job
      go-lint: ${{ steps.filter.outputs.go_lint }}
      scan-known: ${{ steps.selection.outputs.known }}
      scan-selection: ${{ steps.selection.outputs.selection }}
      codeql-matrix: ${{ steps.selection.outputs.codeql_matrix }}
      protected-owner: ${{ steps.protected-owner.outputs.confirmed }}
    steps:
      - name: Verify protected workflow identity
        if: ${{ inputs.trusted-source }}
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          if [[ "$WORKFLOW_REPOSITORY" != Concord-Voice/Desktop ||
                ! "$WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Protected PR CI workflow identity is unavailable or invalid."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Read fresh PR metadata before policy execution. The PR's changed paths
      # remain data for dorny; executable policy comes only from protected main.
      - name: Read validated PR metadata
        id: metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/scan-pr.json"; then
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! jq -e '
            .base.ref == "main" and
            (.head.sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.base.sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.merge_commit_sha | type == "string" and test("^[0-9a-f]{40}$")) and
            (.changed_files | type == "number" and floor == . and . >= 0 and . <= 3000)
          ' "$RUNNER_TEMP/scan-pr.json" >/dev/null; then
            echo 'valid=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '"valid=true", "head_sha=" + .head.sha, "base_sha=" + .base.sha,
            "merge_sha=" + .merge_commit_sha, "changed_files=" + (.changed_files|tostring),
            "hotfix=" + ([.labels[].name] | any(. == "risk: hotfix") | tostring)' \
            "$RUNNER_TEMP/scan-pr.json" >> "$GITHUB_OUTPUT"

      # This checkout is the only executable source for the detector helper.
      # Before the helper lands on main it is absent; selection stays unknown
      # while this job's established component outputs and scanners still run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.metadata.outputs.valid == 'true'
        id: policy
        continue-on-error: true
        with:
          ref: ${{ inputs.trusted-source && fromJSON(toJSON(job)).workflow_sha || steps.metadata.outputs.base_sha }}
          path: policy
          persist-credentials: false

      - name: Record protected policy revision
        id: policy-revision
        if: steps.metadata.outputs.valid == 'true'
        continue-on-error: true
        env:
          EXPECTED_BASE_SHA: ${{ inputs.trusted-source && fromJSON(toJSON(job)).workflow_sha || steps.metadata.outputs.base_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git -C policy rev-parse HEAD 2>/dev/null || true)"
          if [[ "$actual_sha" == "$EXPECTED_BASE_SHA" ]]; then
            echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          fi

      # SHA-pinned per supply-chain hardening (#847). Matches build.yml's pin.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: ${{ inputs.trusted-source && 'policy/.github/ci/scan-relevance.yml' || '.github/ci/scan-relevance.yml' }}
          predicate-quantifier: some-with-excludes
      # Exactly what the managed firewall fixture suite reads. It stays out of
      # scan-relevance.yml: every key there is part of the protected scanner
      # selection contract, and a key the protected base does not know yet
      # turns the whole selection unknown. pr-ci.yml is left out on purpose,
      # so CI-only edits do not run the suite. The pre-commit hook triggers on
      # more files because it also runs the caller and RTC parity suites,
      # which stay in static-guards.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: firewall-filter
        if: ${{ !inputs.enforcement-only }}
        with:
          filters: |
            managed_firewall:
              - 'infrastructure/docker/iptables/**'
              - 'fixtures/policy/deployment/tests/managed_firewall_fixture.py'
              - 'fixtures/policy/deployment/tests/managed_firewall_fake.py'
              - 'fixtures/policy/deployment/tests/test-managed-firewall.sh'
      - name: Compose protected scan selection
        id: selection
        env:
          FILTERS: >-
            {"all_changed":"${{ steps.filter.outputs.all_changed }}","codeql_actions":"${{ steps.filter.outputs.codeql_actions }}","codeql_go":"${{ steps.filter.outputs.codeql_go }}","codeql_js":"${{ steps.filter.outputs.codeql_js }}","eslint":"${{ steps.filter.outputs.eslint }}","govulncheck":"${{ steps.filter.outputs.govulncheck }}","osv":"${{ steps.filter.outputs.osv }}","semgrep_custom":"${{ steps.filter.outputs.semgrep_custom }}","semgrep_community":"${{ steps.filter.outputs.semgrep_community }}","semgrep_canary":"${{ steps.filter.outputs.semgrep_canary }}","sonar":"${{ steps.filter.outputs.sonar }}","sonar_force_all":"${{ steps.filter.outputs.sonar_force_all }}","sonar_desktop":"${{ steps.filter.outputs.sonar_desktop }}","sonar_control_plane":"${{ steps.filter.outputs.sonar_control_plane }}","sonar_media_plane":"${{ steps.filter.outputs.sonar_media_plane }}","sonar_admin":"${{ steps.filter.outputs.sonar_admin }}","selfhost":"${{ steps.filter.outputs.selfhost }}","services":"${{ steps.filter.outputs.services }}","spa":"${{ steps.filter.outputs.spa }}","desktop":"${{ steps.filter.outputs.desktop }}","control_plane":"${{ steps.filter.outputs.control_plane }}","media_plane":"${{ steps.filter.outputs.media_plane }}","media_plane_tests":"${{ steps.filter.outputs.media_plane_tests }}","admin":"${{ steps.filter.outputs.admin }}","production_docker":"${{ steps.filter.outputs.production_docker }}","native":"${{ steps.filter.outputs.native }}","go_lint":"${{ steps.filter.outputs.go_lint }}","dev_stack":"${{ steps.filter.outputs.dev_stack }}","go_toolchain":"${{ steps.filter.outputs.go_toolchain }}","openapi":"${{ steps.filter.outputs.openapi }}","spa_env":"${{ steps.filter.outputs.spa_env }}","deployment":"${{ steps.filter.outputs.deployment }}","selfhost_guard":"${{ steps.filter.outputs.selfhost_guard }}","feature_wiring":"${{ steps.filter.outputs.feature_wiring }}","adr_numbers":"${{ steps.filter.outputs.adr_numbers }}","secrets_contract":"${{ steps.filter.outputs.secrets_contract }}","dispatch_trust":"${{ steps.filter.outputs.dispatch_trust }}","go_test_contracts":"${{ steps.filter.outputs.go_test_contracts }}","review_contracts":"${{ steps.filter.outputs.review_contracts }}","tooling_mirrors":"${{ steps.filter.outputs.tooling_mirrors }}","graphify_contracts":"${{ steps.filter.outputs.graphify_contracts }}","native_ioc":"${{ steps.filter.outputs.native_ioc }}","sonar_profile":"${{ steps.filter.outputs.sonar_profile }}","changelog":"${{ steps.filter.outputs.changelog }}","dev_checks":"${{ steps.filter.outputs.dev_checks }}","workflow_lint":"${{ steps.filter.outputs.workflow_lint }}","worker_apple":"${{ steps.filter.outputs.worker_apple }}","worker_invite":"${{ steps.filter.outputs.worker_invite }}","license_desktop":"${{ steps.filter.outputs.license_desktop }}","license_media":"${{ steps.filter.outputs.license_media }}","license_admin":"${{ steps.filter.outputs.license_admin }}","license_go":"${{ steps.filter.outputs.license_go }}"}
          METADATA: >-
            {"event_name":"pull_request","hotfix":${{ steps.metadata.outputs.hotfix == 'true' }},"head_sha":"${{ steps.metadata.outputs.head_sha }}","base_sha":"${{ steps.metadata.outputs.base_sha }}","merge_sha":"${{ steps.metadata.outputs.merge_sha }}","changed_files":${{ steps.metadata.outputs.changed_files || '-1' }}}
          SCAN_MODE: ${{ inputs.trusted-source && (vars.CI_SCAN_RELEVANCE_MODE == '' || vars.CI_SCAN_RELEVANCE_MODE == 'legacy') && 'required-full' || vars.CI_SCAN_RELEVANCE_MODE }}
          POLICY_SHA: ${{ steps.policy-revision.outputs.sha }}
          METADATA_VALID: ${{ steps.metadata.outputs.valid }}
        run: |
          set -euo pipefail
          {
            # Keep an invalid/missing protected selection visible as unknown;
            # the final API verdict fails closed instead of inferring false.
            echo 'known=false'
            echo 'selection={"version":1,"known":false,"advisory":{"static_guards":true},"workers":["apple-sso-bridge","invite-landing"],"npm_workspaces":["desktop","services/media-plane","client/admin"],"license_go":true}'
            echo 'codeql_matrix={"include":[]}'
          } >> "$GITHUB_OUTPUT"
          if [[ "$METADATA_VALID" != 'true' || -z "$POLICY_SHA" || ! -f policy/.github/scripts/ci-scan-relevance.mjs ]]; then
            exit 0
          fi
          node - "$RUNNER_TEMP/scan-selection-input.json" <<'NODE'
          const fs = require('node:fs');
          const filters = JSON.parse(process.env.FILTERS);
          const metadata = JSON.parse(process.env.METADATA);
          fs.writeFileSync(process.argv[2], JSON.stringify({
            filters, metadata, mode: process.env.SCAN_MODE,
            policy_sha: process.env.POLICY_SHA,
          }));
          NODE
          node "$GITHUB_WORKSPACE/policy/.github/scripts/ci-scan-relevance.mjs" "$RUNNER_TEMP/scan-selection-input.json"

      # The ordinary PR event keeps full scanning unless the effective main
      # rules prove that the protected workflow owns the same scanner DAG.
      - name: Confirm protected scanner owner
        id: protected-owner
        if: ${{ !inputs.enforcement-only }}
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ vars.CI_SCAN_RELEVANCE_MODE }}
          SELECTION: ${{ steps.selection.outputs.selection }}
        run: |
          set -euo pipefail
          echo 'confirmed=false' >> "$GITHUB_OUTPUT"
          [[ "$MODE" == required-full || "$MODE" == required-relevant ]] || exit 0
          jq -e '.known == true and (.hotfix | type == "boolean") and
            (.mode == "required-full" or .mode == "required-relevant")' \
            <<< "$SELECTION" >/dev/null 2>&1 || exit 0
          pages="$RUNNER_TEMP/pr-ci-effective-rules.jsonl"
          : > "$pages"
          for page in {1..10}; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main?per_page=100&page=${page}" > "$RUNNER_TEMP/pr-ci-rules-page.json"; then
              exit 0
            fi
            jq -e 'type == "array" and length <= 100' "$RUNNER_TEMP/pr-ci-rules-page.json" >/dev/null || exit 0
            cat "$RUNNER_TEMP/pr-ci-rules-page.json" >> "$pages"
            printf '\n' >> "$pages"
            count=$(jq 'length' "$RUNNER_TEMP/pr-ci-rules-page.json")
            [[ "$count" -lt 100 ]] && break
            [[ "$page" -lt 10 ]] || exit 0
          done
          # Either spelling of main: the short one is live before the hardening
          # runbook is applied and again after its `--rollback`, the fully
          # qualified one in between (a tag named main cannot satisfy it).
          # Neither may be pinned to a commit. GitHub describes `sha` as "the
          # commit SHA of the workflow file to use" and does not say how it
          # combines with `ref`, so a pinned entry is not proof that main's copy
          # of the workflow is the one that runs. The effective-rules response
          # omits `sha` when none is set, and `.sha == null` covers that and an
          # explicit null; an empty or any other value is not a confirmation.
          jq -e -s 'any(.[][]; .type == "workflows" and
            any(.parameters.workflows[]?;
              .repository_id == 1425846887 and
              .path == ".github/workflows/required-pr-build.yml" and
              (.ref == "main" or .ref == "refs/heads/main") and
              .sha == null))' \
            "$pages" >/dev/null || exit 0
          echo 'confirmed=true' >> "$GITHUB_OUTPUT"

  # ─── Workflow-file structural guards (#920 PR-A trust-model lock-ins) ─
  # Lint checks codifying invariants surfaced by the 2026-05-09 cascade
  # (#893/#900/#904/#906/#910). The shared workflow_lint family selects this
  # runner from the union of its policy inputs and the former inline fast-path
  # inputs; each selected check still validates its full governed surface.
  workflow-lint:
    name: workflow-lint
    needs: [ioc, detect-changes]
    if: ${{ !inputs.enforcement-only && !cancelled() && needs.ioc.result == 'success' && (needs.detect-changes.result != 'success' || needs.detect-changes.outputs.scan-known != 'true' || fromJSON(needs.detect-changes.outputs.scan-selection).hotfix || fromJSON(needs.detect-changes.outputs.scan-selection).advisory.workflow_lint) }}
    permissions:
      contents: read
    # ADR-0013 §2 / ADR-0005 §3: ADR-0016 measured sub-minute parity;
    # 2-vCPU Blacksmith is the half-cost tier for detect/verify work.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install python3 + PyYAML (lint dependencies)
        # §5.1 and §5.2 lints rely on python3 + PyYAML. ubuntu-latest ships
        # python3 by default; pyyaml is the only extra install. Uses
        # --user to align with build.yml's pattern and avoid pip needing
        # write access to system site-packages (PEP-668 on recent
        # ubuntu-latest images marks system Python as externally-managed
        # and rejects unprefixed installs).
        run: |
          python3 -m pip install --user --quiet --require-hashes --only-binary=:all: -r .github/requirements-pyyaml.txt

      - name: TruffleHog runtime is digest-pinned
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import yaml

          text = Path('.github/workflows/secret-scanning.yml').read_text()
          action = re.search(r'^\s*uses:\s*trufflesecurity/trufflehog@[0-9a-f]{40}\s+# v(\d+\.\d+\.\d+)\s*$', text, re.MULTILINE)
          assert action, 'TruffleHog action must use a full SHA with a bare version comment'
          workflow = yaml.safe_load(text)
          step = next(step for step in workflow['jobs']['trufflehog-ci']['steps'] if str(step.get('uses', '')).startswith('trufflesecurity/trufflehog@'))
          runtime = str(step.get('with', {}).get('version', 'latest'))
          assert re.fullmatch(rf'{re.escape(action.group(1))}@sha256:[0-9a-f]{{64}}', runtime), f'TruffleHog runtime must match action v{action.group(1)} and be digest-pinned; got {runtime}'
          PY

      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      - name: Desktop PR/release trust boundary (#2274)
        run: bash .github/scripts/lint-pr-release-trust.sh --unsigned .

      - name: §5.2 — multi-secret AND-check completeness
        run: bash .github/scripts/lint-multisecret-andcheck.sh .github/workflows/

      - name: §5.3 — always() requires justification comment
        run: bash .github/scripts/lint-always-needs-comment.sh .github/workflows/

      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      - name: G3 — workflow_dispatch boolean comparison enforcement (#1000)
        run: bash .github/scripts/lint-boolean-coercion.sh .github/workflows/

      # Closes the split that occurred three times during #3139: a suite wired
      # into one of the two lists below and not the other runs nowhere, and
      # reports nothing when it doesn't.
      - name: Test suites are both invoked and reachable by their filter (#3139)
        run: bash .github/scripts/lint-test-suite-wiring.sh

      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      - name: G4 — empty expression tokens inside run-block bash comments (#1001)
        run: bash .github/scripts/lint-empty-expression.sh .github/workflows/

      - name: G5 — gh CLI requires --repo when no checkout (#1002)
        run: bash .github/scripts/lint-gh-repo-flag.sh .github/workflows/

      # P14 — workflow-injection guard (#836). actionlint installed via
      # curl-pinned release binary with SHA256 verification. Spec:
      # internal-reference §4.3 + §6.4.
      # Shellcheck integration is ENABLED — the 27 pre-existing shellcheck
      # info/style findings have been cleaned up (8 in #1088 + the bundled
      # provision-secrets.yml fix in this commit).
      - name: P14 — install actionlint (#836, pinned binary)
        env:
          ACTIONLINT_VERSION: v1.7.12
          # Public release checksum (not a secret). Source:
          # https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  # pragma: allowlist secret
        run: |
          set -euo pipefail
          TARBALL="actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz"
          curl -sLo "/tmp/${TARBALL}" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_VERSION}/${TARBALL}"
          echo "${ACTIONLINT_SHA256}  /tmp/${TARBALL}" | sha256sum -c -
          tar -xzf "/tmp/${TARBALL}" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: P14 — actionlint workflow-injection scan (#836)
        run: actionlint -config-file=.actionlint.yaml

      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
      - name: Self-test — lint scripts pass their own test suites
        # Defense-in-depth: re-run each lint's hermetic test suite in CI
        # so a regression to the lint scripts themselves is caught even
        # if a developer skips pre-commit.
        run: |
          bash .github/scripts/tests/lint-pr-release-trust.test.sh
          python3 .github/scripts/tests/test_verify_unsigned_desktop.py
          python3 .github/scripts/tests/test_ci_scan_verdict.py
          bash .github/scripts/tests/resolve-hotfix-label.test.sh
          bash .github/scripts/tests/lint-multisecret-andcheck.test.sh
          bash .github/scripts/tests/lint-always-needs-comment.test.sh
          # D: lint-branch-protection.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          # D: sonar-required-gate.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          # D: lint-deploy-app-bypass.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          bash .github/scripts/tests/lint-boolean-coercion.test.sh
          bash .github/scripts/tests/lint-empty-expression.test.sh
          bash .github/scripts/tests/lint-gh-repo-flag.test.sh
          bash .github/scripts/tests/lint-workflow-injection.test.sh
          # D: lint-sync-releases-secret-path.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          # D: lint-spa-real-asset-retry.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          bash .github/scripts/tests/parse-dispatched-workflow.test.sh
          bash .github/scripts/tests/workflow-validate-report.test.sh
          # D: deploy-canary.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          # D: deployment-access-west.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          python3 .github/scripts/tests/test_print_codeql_results.py
          bash .github/scripts/tests/classify-release.test.sh
          bash .github/scripts/tests/verify-changelog.test.sh
          bash .github/scripts/tests/promote-unreleased-changelog.test.sh
          # Both of these existed with NO runner at all — not this step, not
          # pre-commit — so they had never executed in CI or locally.
          # D: check-pattern-register.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          # D: check-required-statuses.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          # D: deployment-client.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          bash .github/scripts/tests/lint-test-suite-wiring.test.sh
          bash .github/scripts/tests/ci-scan-relevance.test.sh
          # D: trivy-assert-os.test.sh remains with Self-Hosted / Hosted and private Alpha policy.
          # D: server bootstrap and secret catalog tests remain with Self-Hosted / Hosted.
          # D: server bootstrap and secret catalog tests remain with Self-Hosted / Hosted.

  # NOTE: the former verify-openapi-coverage, verify-spa-env, and
  # verify-deploy-scripts jobs are consolidated into the single `static-guards`
  # job earlier in this file (2026-07 CI deep-dive).

  # Final protected-source API report. This job reports its actual needs
  # results; the protected wrapper adds its selected OSV job result separately.
  # always() preserves failed and skipped producers as explicit values for
  # the required wrapper.
      - name: Protected workflow pin contract
        # Bootstrap pins intentionally fail until this port reaches main. Run every contract.
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/tests/test_verify_required_build_pins.py

      - name: Protected CodeQL call graph
        # Bootstrap pins intentionally fail until this port reaches main. Run every contract.
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/tests/test_codeql_required_workflow.py

      - name: Reusable workflow call contract
        # Bootstrap pins intentionally fail until this port reaches main. Run every contract.
        if: ${{ !cancelled() }}
        run: bash .github/scripts/tests/lint-workflow-call-contract.test.sh

  report:
    name: report
    needs: [ioc, detect-changes, build, semgrep, eslint]
    if: ${{ always() && (inputs.enforcement-only || !(github.event.action == 'edited' && github.event.changes.base == null && (github.event.changes.title != null || github.event.changes.body != null))) }}
    permissions:
      contents: read
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.report.outputs.selection }}
      jobs: ${{ steps.report.outputs.jobs }}
      coverage-uploads: ${{ steps.report.outputs.coverage-uploads }}
    steps:
      - name: Check out immutable workflow source
        if: ${{ inputs.trusted-source }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          persist-credentials: false

      - name: Confirm report policy source
        if: ${{ inputs.trusted-source }}
        env:
          WORKFLOW_REPOSITORY: ${{ fromJSON(toJSON(job)).workflow_repository }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
          POLICY_SHA: ${{ needs.detect-changes.outputs.scan-selection && fromJSON(needs.detect-changes.outputs.scan-selection).policy_sha || '' }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$WORKFLOW_REPOSITORY" != Concord-Voice/Desktop ||
                ! "$WORKFLOW_SHA" =~ ^[0-9a-fA-F]{40}$ || "$actual_sha" != "$WORKFLOW_SHA" ]]; then
            echo "::error::Protected report source identity is unavailable or invalid."
            exit 1
          fi
          if [[ "$POLICY_SHA" != "$WORKFLOW_SHA" ]]; then
            echo "::error::Scan selection is not bound to this protected workflow source."
            exit 1
          fi

      - name: Emit actual scan results
        id: report
        env:
          SELECTION: ${{ needs.detect-changes.outputs.scan-selection || '{}' }}
          IOC_RESULT: ${{ needs.ioc.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          ESLINT_RESULT: ${{ needs.eslint.result }}
          GOVULNCHECK_RESULT: 'skipped'
          DESKTOP_COVERAGE: ${{ needs.build.outputs.desktop-coverage == 'true' }}
          CONTROL_PLANE_COVERAGE: ${{ needs.build.outputs.control-plane-coverage == 'true' }}
          MEDIA_PLANE_COVERAGE: ${{ needs.build.outputs.media-plane-coverage == 'true' }}
          ADMIN_COVERAGE: ${{ needs.build.outputs.admin-coverage == 'true' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          jobs = {
              'ioc': os.environ['IOC_RESULT'],
              'build': os.environ['BUILD_RESULT'],
              'semgrep': os.environ['SEMGREP_RESULT'],
              'eslint': os.environ['ESLINT_RESULT'],
              'govulncheck': os.environ['GOVULNCHECK_RESULT'],
          }
          coverage = {
              'desktop': os.environ['DESKTOP_COVERAGE'] == 'true',
              'control_plane': os.environ['CONTROL_PLANE_COVERAGE'] == 'true',
              'media_plane': os.environ['MEDIA_PLANE_COVERAGE'] == 'true',
              'admin': os.environ['ADMIN_COVERAGE'] == 'true',
          }
          try:
              selection = json.loads(os.environ['SELECTION'])
              if not isinstance(selection, dict):
                  selection = {}
          except (TypeError, ValueError):
              selection = {}
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as stream:
              for name, value in (('selection', selection), ('jobs', jobs), ('coverage-uploads', coverage)):
                  stream.write(f'{name}={json.dumps(value, separators=(",", ":"))}\n')
          PY

      # always() preserves scan outputs before a selected lab failure blocks the verdict.
      # D: this guard and its suite belong to Self-Hosted / Hosted or the private Alpha tooling repository.
