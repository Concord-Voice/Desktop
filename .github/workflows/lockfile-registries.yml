name: Lockfile Registries

# Fails a PR whose lockfile resolves outside the approved registries, whose
# .npmrc uses a setting not on the script's allowed list, or whose go.mod or
# go.work adds a replace directive (#216). Approved hosts live in
# .github/scripts/approved-registries.txt. No install, no secrets, read-only.
# It runs on every PR, with no paths filter: the check takes seconds, and a
# filter would have to match every case variant npm reads on Windows.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: lockfile-registries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-registries:
    name: Lockfile registries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test — the off-registry fixture must fail
        run: bash .github/scripts/tests/check-lockfile-registries.test.sh

      - name: Check every tracked lockfile, .npmrc and go.mod
        run: bash .github/scripts/check-lockfile-registries.sh
