# TEMPORARY diagnostic - do not merge. Runs one verbose Sonar branch
# analysis to find the file that hits the JS security engine's 300 s
# React render simulation limit. Delete this branch afterwards.
name: Diag Jasmin stall
on:
  push:
    branches: [claude/project-thread-qdr8cj]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verbose Sonar scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0  # pragma: allowlist secret
        with:
          args: -Dsonar.verbose=true -Dsonar.branch.name=diag-jasmin-stall
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
