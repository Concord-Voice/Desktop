name: Refresh the desktop npm lockfile

# Weekly refresh of desktop/package-lock.json (#217). Dependabot only moves
# direct dependencies; this moves transitive packages to the newest version
# their existing ranges allow.
#
# What it may change: desktop/package-lock.json, nothing else. It runs
# `npm update --package-lock-only`, so it stays inside the ranges already in
# package.json and never installs a package. `--ignore-scripts` is set as well,
# and `min-release-age=7` keeps any version published in the last 7 days out of
# the lockfile (desktop/.npmrc sets the same window). Majors stay with
# Dependabot. The refresh job fails if any other file changed, including
# desktop/package.json.
#
# Runs Thursday 06:30 UTC. Dependabot opens its npm batch on Tuesday (05:00 in
# .github/dependabot.yml) and /weekly-deps reviews it on Wednesday, so by
# Thursday that batch is usually merged. Ordering is not an invariant: the
# contention guard below defers the run while a Dependabot npm PR for desktop/
# is open, whatever the day.
#
# The three-job split is a security boundary. A job receives every secret it
# references, and its `GITHUB_TOKEN`, when the job starts, whatever the step
# order.
#   guard    holds the only `GITHUB_TOKEN` write scope (`pull-requests`), for
#            the deferral comment. It runs no npm.
#   refresh  resolves packages from the registry. Its `GITHUB_TOKEN` is
#            read-only and it references no secret.
#   open-pr  holds the App key. It runs no npm: it copies the lockfile out of
#            the artifact, and create-pull-request reads the rendered body
#            from the artifact directory.
# Do not merge the jobs, and do not add npm commands to guard or open-pr.
# .github/scripts/tests/npm-lockfile-flush.test.sh locks these rules.

on:
  schedule:
    - cron: "30 6 * * 4"
  workflow_dispatch:

# Least-privilege default. The guard job adds only `pull-requests: write`, for
# its `gh pr comment`. The branch push and the PR itself use the App
# installation token, so `GITHUB_TOKEN` never needs `contents: write`.
permissions:
  contents: read

concurrency:
  group: npm-lockfile-flush
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      deferred: ${{ steps.contention.outputs.deferred }}
    steps:
      # `gh` infers the repository from the checkout. Nothing in it is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Contention guard — defer if open Dependabot npm PRs touch the desktop lockfile
        id: contention
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Dependabot names npm branches dependabot/npm_and_yarn/<directory>/<package>.
          # The desktop entry covers desktop/ and its desktop/tools/* compat
          # packages, which all resolve into desktop/package-lock.json. Other npm
          # roots (tools/concord-bridge, .github/tools/license-checker) are not
          # refreshed here. Only PRs Dependabot opened from this repository
          # count: anyone can open a fork PR with a dependabot/... branch name,
          # and that must neither stall the flush nor draw the deferral comment.
          OPEN_PRS=$(gh pr list \
            --author app/dependabot \
            --search "head:dependabot/npm_and_yarn/desktop/" \
            --state open \
            --json number,headRefName,author,isCrossRepository \
            --jq '[.[] | select(.author.login == "app/dependabot" and .isCrossRepository == false) | select(.headRefName | startswith("dependabot/npm_and_yarn/desktop/")) | .number | tostring] | join(" ")')

          if [ -z "$OPEN_PRS" ]; then
            echo "No open Dependabot npm PRs for desktop/. Proceeding."
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Open Dependabot npm PRs detected: $OPEN_PRS"
          echo "deferred=true" >> "$GITHUB_OUTPUT"

          TODAY=$(date -u +%Y-%m-%d)
          MARKER="<!-- npm-lockfile-flush-deferral-${TODAY} -->"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # One body for every PR in the loop: it has no per-PR substitutions.
          cat > /tmp/deferral-comment.md <<DEFERRAL
          ${MARKER}

          \`npm-lockfile-flush\` deferred the run for this week. This branch is open against \`desktop/package-lock.json\`, which the flush would also change, so the two PRs would conflict. It runs again next Thursday 06:30 UTC.

          No action needed. Next week the workflow checks again and proceeds once this branch has merged or closed.

          — Run: ${RUN_URL}
          DEFERRAL

          # Idempotency: skip a PR that already got a deferral comment in the last 6 days (518400s).
          # --paginate runs --jq once per page, so print one line per match and count lines.
          for PR in $OPEN_PRS; do
            RECENT=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
              --jq '.[] | select(.body | contains("<!-- npm-lockfile-flush-deferral-")) | select(.created_at | fromdateiso8601 > (now - 518400)) | .id' | wc -l)

            if [ "$RECENT" -gt 0 ]; then
              echo "PR #${PR} already has a recent deferral comment. Skipping."
              continue
            fi

            gh pr comment "$PR" --body-file /tmp/deferral-comment.md
            echo "Added deferral comment to PR #${PR}."
          done

          echo "Exiting success-skip due to contention."
          exit 0

  refresh:
    needs: guard
    if: needs.guard.outputs.deferred != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      # 'true' or 'false' from the refresh step; empty when this job is skipped.
      has_changes: ${{ steps.refresh.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No npm cache: a cache entry is state shared between runs, and this job
      # resolves third-party packages. Same Node as release.yml.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0

      - name: Refresh the desktop lockfile within existing ranges
        id: refresh
        env:
          # Also set as flags below; the env form covers any npm sub-process.
          npm_config_ignore_scripts: 'true'
          npm_config_min_release_age: '7'
        run: |
          set -euo pipefail

          # An npm without min-release-age would accept the flag and ignore it,
          # letting a version from the last 7 days through. Fail instead. The
          # probe unsets the env value: npm echoes unknown env settings in its
          # listing, so only the built-in default line proves npm knows it. It
          # runs outside desktop/, whose .npmrc sets the value.
          if ! env -u npm_config_min_release_age npm config ls -l | grep -qx 'min-release-age = null'; then
            echo "::error::npm $(npm --version) has no min-release-age setting; refusing to refresh without the 7-day window"
            exit 1
          fi

          (cd desktop && npm update --package-lock-only --ignore-scripts --min-release-age=7 --no-audit --no-fund)

          # No downgrades. With no package names, `npm update` re-resolves the whole
          # tree under min-release-age, so a version locked less than 7 days ago
          # (a Dependabot security fix has no cooldown) can come back older, or
          # npm stops with ETARGET. Fail and list them; the next run, once they
          # are 7 days old, keeps them. The check is per package name and major,
          # on the highest copy: npm re-hoists, so the copy at one install path
          # can change major while the newer copy moves to a nested path. A 0.x
          # minor counts as a major, as `^` treats it.
          LOCK=desktop/package-lock.json
          DOWNGRADES=$(jq -rn --slurpfile old <(git show "HEAD:$LOCK") --slurpfile new "$LOCK" --arg lock "$LOCK" '
            def core: capture("^(?<a>[0-9]+)[.](?<b>[0-9]+)[.](?<c>[0-9]+)(-(?<p>[0-9A-Za-z.-]+))?([+].*)?$")
              | [(.a | tonumber), (.b | tonumber), (.c | tonumber), (if .p then 0 else 1 end),
                 ((.p // "") | split(".") | map(tonumber? // .))];
            def semver: type == "string" and test("^[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.-]+)?([+].*)?$");
            def line: core | if .[0] == 0 then "0.\(.[1])" else "\(.[0])" end;
            def bymajor: [.packages | to_entries[] | select(.key != "" and (.value.version | semver))
                | {k: "\(.value.name // (.key | sub("^.*node_modules/"; "")))@\(.value.version | line)",
                   v: (.value.version | core), s: .value.version}]
              | group_by(.k) | map({key: .[0].k, value: max_by(.v)}) | from_entries;
            ($old[0] | bymajor) as $O | ($new[0] | bymajor) as $N
            | $O | keys[] | select($N[.] != null and ($N[.].v < $O[.].v))
            | "\($lock): \(.) \($O[.].s) -> \($N[.].s)"')
          if [ -n "$DOWNGRADES" ]; then
            echo "::error::the refresh would downgrade these locked versions (each is newer than the 7-day window):"
            printf '%s\n' "$DOWNGRADES"
            exit 1
          fi

          # Every `file:` override must still resolve in the lockfile. npm resolves
          # an override's relative path from each consumer, not from desktop/, so a
          # re-hoist can silently swap the compat adapters in desktop/tools/ for
          # registry glob/minimatch majors their old-API consumers cannot call.
          # Fail rather than open a lockfile that breaks the packaging tools.
          DROPPED=$(jq -rn --slurpfile pkg desktop/package.json --slurpfile new "$LOCK" '
            [$new[0].packages[] | .resolved? // empty] as $have
            | ($pkg[0].overrides // {}) | .. | strings | select(startswith("file:"))
            | sub("^file:(\\./)?"; "file:") | select(. as $w | $have | index($w) | not)')
          if [ -n "$DROPPED" ]; then
            echo "::error::the refresh dropped these file: overrides from $LOCK (see desktop/tools/README.md):"
            printf '%s\n' "$DROPPED"
            exit 1
          fi

          # Presence alone is insufficient for the legacy packaging consumers:
          # a root adapter can survive while a nearer registry package shadows
          # it after npm re-hoists. Check each old glob/minimatch edge using the
          # lockfile's Node-style parent lookup, before this job opens a PR.
          node .github/scripts/check-lockfile-compat.cjs "$LOCK" "$(npm root -g)"

          # Lockfile only. Any other change, desktop/package.json above all, means
          # npm did something this workflow does not allow: stop.
          OTHER=$(git status --porcelain --untracked-files=all | cut -c4- | { grep -vxF "$LOCK" || true; })
          if [ -n "$OTHER" ]; then
            echo "::error::the refresh changed files other than $LOCK:"
            printf '%s\n' "$OTHER"
            exit 1
          fi

          if git diff --quiet; then
            echo "No lockfile updates available. The open-pr job will be skipped."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git diff --stat
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Render PR body
        if: steps.refresh.outputs.has_changes == 'true'
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          set -euo pipefail
          GEN_STAMP=$(date -u '+%A %Y-%m-%d at %H:%M UTC')

          # Entries whose version changed, appeared or went away.
          CHANGED=$(jq -n --slurpfile old <(git show HEAD:desktop/package-lock.json) --slurpfile new desktop/package-lock.json '
            def versions: .packages | with_entries(.value = .value.version);
            ($old[0] | versions) as $o | ($new[0] | versions) as $n
            | [($o + $n) | keys[] | select($o[.] != $n[.])] | length')

          cat > /tmp/pr-body.md <<EOF
          Automated refresh of \`desktop/package-lock.json\`.

          Generated by \`.github/workflows/npm-lockfile-flush.yml\` (trigger: \`${TRIGGER}\`) on ${GEN_STAMP}.

          ## What this PR contains

          \`npm update --package-lock-only --ignore-scripts --min-release-age=7\` was run in \`desktop/\` against the current \`main\`. ${CHANGED} lockfile entries changed.

          - Lockfile only: the workflow fails if \`desktop/package.json\` or any other file changes.
          - No downgrades: the workflow fails if any locked package line goes down.
          - Compat adapters kept: the workflow fails if a \`file:\` override in \`desktop/package.json\` no longer resolves in the lockfile. It also checks the adapter each legacy packaging consumer resolves.
          - Overrides can move a package across majors. Check that the dependency-compat tests are green.
          - No version published in the last 7 days (\`min-release-age\`).
          - No install scripts ran: \`--package-lock-only\` installs nothing, and \`--ignore-scripts\` is set too.

          ## Review checklist

          - [ ] Desktop tests, lint and the PR smoke build are green in CI
          - [ ] The npm audit, OSV and lockfile registry checks are green
          - [ ] Diff size is plausible

          ## Coordination

          The contention guard ran first and found no open Dependabot npm PR for \`desktop/\`. If one opens before this PR merges, expect a rebase.
          EOF
          echo "Rendered PR body to /tmp/pr-body.md"

      - name: Stage the PR payload
        if: steps.refresh.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flush/desktop"
          cp /tmp/pr-body.md "$RUNNER_TEMP/flush/"
          cp desktop/package-lock.json "$RUNNER_TEMP/flush/desktop/"

      - name: Upload the PR payload
        if: steps.refresh.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-lockfile-flush
          path: ${{ runner.temp }}/flush
          retention-days: 1
          if-no-files-found: error

  open-pr:
    needs: refresh
    if: needs.refresh.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-lockfile-flush
          path: ${{ runner.temp }}/flush

      # The payload is data from the lower-trust job. It is copied, never executed.
      - name: Apply the refreshed lockfile
        run: cp "$RUNNER_TEMP/flush/desktop/package-lock.json" desktop/package-lock.json

      # Same App and same pinned action as refresh-ioc-list.yml.
      - name: Mint flush App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.PUBLIC_MIRROR_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLIC_MIRROR_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open PR
        # Same SHA as refresh-ioc-list.yml.
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Pin BOTH identities: the default author is github.actor, which on a
          # dispatch is whoever pressed it.
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: chore/npm-lockfile-flush
          delete-branch: true
          title: "chore: refresh the desktop npm lockfile"
          labels: "type: chore,area: deps,area: desktop"
          commit-message: "chore: refresh the desktop npm lockfile"
          body-path: ${{ runner.temp }}/flush/pr-body.md
          # The only path the PR may carry. Anything else in the working tree
          # is ignored even if the copy above went wrong.
          add-paths: |
            desktop/package-lock.json
