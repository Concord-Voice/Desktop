# Release-impact PR comment publisher. Classification data is collected
# from protected base code in a separate read-only job; this workflow's only
# write-capable job consumes validated bounded outputs and never checks out code.
name: Classify release comment

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
      - '.github/workflows/desktop-pr-smoke.yml'
      - '.github/workflows/classify-release.yml'
      - '.github/workflows/classify-release-comment.yml'
      - '.github/scripts/classify-release.sh'
      - '.github/scripts/lint-pr-release-trust.sh'

concurrency:
  group: classify-release-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify-data:
    name: Collect release classification data
    if: github.repository == 'Concord-Voice/Desktop' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shell_changed: ${{ steps.validate.outputs.shell_changed }}
      old_contract: ${{ steps.validate.outputs.old_contract }}
      new_contract: ${{ steps.validate.outputs.new_contract }}
      contract_action: ${{ steps.validate.outputs.contract_action }}
      old_version: ${{ steps.validate.outputs.old_version }}
      new_version: ${{ steps.validate.outputs.new_version }}
      version_action: ${{ steps.validate.outputs.version_action }}
      old_spa_min: ${{ steps.validate.outputs.old_spa_min }}
      new_spa_min: ${{ steps.validate.outputs.new_spa_min }}
      spa_min_action: ${{ steps.validate.outputs.spa_min_action }}
      spa_min_present: ${{ steps.validate.outputs.spa_min_present }}
      version_bump_required: ${{ steps.validate.outputs.version_bump_required }}
      bump_level: ${{ steps.validate.outputs.bump_level }}
      bump_basis: ${{ steps.validate.outputs.bump_basis }}
    steps:
      # Protected base only; PR-head objects remain non-executable classifier data.
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout-base
        continue-on-error: true
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch target commit as data
        id: fetch-target
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]{0,8}$ ]]
          [[ "${EVENT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          encoded_token="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${encoded_token}" \
            fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          fetched="$(git rev-parse FETCH_HEAD)"
          [[ "${fetched}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${fetched}" == "${EVENT_HEAD}" ]]
          printf 'TARGET_SHA=%s\n' "${fetched}" >> "${GITHUB_ENV}"

      - name: Classify target commit
        id: classify
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA:-}" =~ ^[0-9a-f]{40}$ ]]
          bash .github/scripts/classify-release.sh

      - name: Validate classifier outputs
        id: validate
        # always(): inspect failed or skipped checkout/fetch/classify outcomes; validation emits no outputs unless every stage and field is valid.
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout-base.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch-target.outcome }}
          CLASSIFY_OUTCOME: ${{ steps.classify.outcome }}
          SHELL_CHANGED: ${{ steps.classify.outputs.shell_changed }}
          OLD_CONTRACT: ${{ steps.classify.outputs.old_contract }}
          NEW_CONTRACT: ${{ steps.classify.outputs.new_contract }}
          CONTRACT_ACTION: ${{ steps.classify.outputs.contract_action }}
          OLD_VERSION: ${{ steps.classify.outputs.old_version }}
          NEW_VERSION: ${{ steps.classify.outputs.new_version }}
          VERSION_ACTION: ${{ steps.classify.outputs.version_action }}
          OLD_SPA_MIN: ${{ steps.classify.outputs.old_spa_min }}
          NEW_SPA_MIN: ${{ steps.classify.outputs.new_spa_min }}
          SPA_MIN_ACTION: ${{ steps.classify.outputs.spa_min_action }}
          SPA_MIN_PRESENT: ${{ steps.classify.outputs.spa_min_present }}
          VERSION_BUMP_REQUIRED: ${{ steps.classify.outputs.version_bump_required }}
          BUMP_LEVEL: ${{ steps.classify.outputs.bump_level }}
          BUMP_BASIS: ${{ steps.classify.outputs.bump_basis }}
        run: |
          set -euo pipefail
          if [[ "$CHECKOUT_OUTCOME" != "success" || "$FETCH_OUTCOME" != "success" || "$CLASSIFY_OUTCOME" != "success" ]]; then
            echo "::notice::Release classification data is unavailable; skipping the advisory comment."
            exit 0
          fi
          # A function, not `if ! { ...; }`: Semgrep's protected scan cannot parse a negated brace
          # group, and any scanner error fails the required check
          # (internal-reference P18). Same shell, same tests, same order.
          classification_is_valid() {
            [[ "${SHELL_CHANGED}" =~ ^(true|false)$ ]] &&
            [[ "${OLD_CONTRACT}" =~ ^(0|[1-9][0-9]{0,8})$ ]] &&
            [[ "${NEW_CONTRACT}" =~ ^(0|[1-9][0-9]{0,8})$ ]] &&
            [[ "${CONTRACT_ACTION}" =~ ^(none|needed|bumped)$ ]] &&
            [[ "${OLD_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ && ${#OLD_VERSION} -le 128 ]] &&
            [[ "${NEW_VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ && ${#NEW_VERSION} -le 128 ]] &&
            [[ "${VERSION_ACTION}" =~ ^(none|notes-needed|bumped)$ ]] &&
            [[ "${OLD_SPA_MIN}" =~ ^(0|[1-9][0-9]{0,8})$ ]] &&
            [[ "${NEW_SPA_MIN}" =~ ^(0|[1-9][0-9]{0,8})$ ]] &&
            [[ "${SPA_MIN_ACTION}" =~ ^(none|raised|lowered|removed)$ ]] &&
            [[ "${SPA_MIN_PRESENT}" =~ ^(true|false)$ ]] &&
            [[ "${VERSION_BUMP_REQUIRED}" =~ ^(true|false)$ ]] &&
            [[ "${BUMP_LEVEL}" =~ ^(none|patch|minor|major)$ ]] &&
            [[ "${BUMP_BASIS}" =~ ^(none|breaking|added|ipc|notes|shell)$ ]]
          }
          if ! classification_is_valid; then
            echo "::notice::Release classification output failed validation; skipping the advisory comment."
            exit 0
          fi
          output_file="$(mktemp)"
          trap 'rm -f "${output_file}"' EXIT
          printf 'shell_changed=%s\nold_contract=%s\nnew_contract=%s\ncontract_action=%s\nold_version=%s\nnew_version=%s\nversion_action=%s\nold_spa_min=%s\nnew_spa_min=%s\nspa_min_action=%s\nspa_min_present=%s\nversion_bump_required=%s\nbump_level=%s\nbump_basis=%s\n' \
            "${SHELL_CHANGED}" "${OLD_CONTRACT}" "${NEW_CONTRACT}" "${CONTRACT_ACTION}" \
            "${OLD_VERSION}" "${NEW_VERSION}" "${VERSION_ACTION}" "${OLD_SPA_MIN}" \
            "${NEW_SPA_MIN}" "${SPA_MIN_ACTION}" "${SPA_MIN_PRESENT}" "${VERSION_BUMP_REQUIRED}" \
            "${BUMP_LEVEL}" "${BUMP_BASIS}" \
            > "${output_file}"
          output_bytes="$(wc -c < "${output_file}" | tr -d '[:space:]')"
          (( output_bytes <= 8192 ))
          cat "${output_file}" >> "${GITHUB_OUTPUT}"

  classify-comment:
    name: Classify release impact
    needs: classify-data
    if: github.repository == 'Concord-Voice/Desktop' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && needs.classify-data.result == 'success' && needs.classify-data.outputs.shell_changed != '' && needs.classify-data.outputs.old_contract != '' && needs.classify-data.outputs.new_contract != '' && needs.classify-data.outputs.contract_action != '' && needs.classify-data.outputs.old_version != '' && needs.classify-data.outputs.new_version != '' && needs.classify-data.outputs.version_action != '' && needs.classify-data.outputs.old_spa_min != '' && needs.classify-data.outputs.new_spa_min != '' && needs.classify-data.outputs.spa_min_action != '' && needs.classify-data.outputs.spa_min_present != '' && needs.classify-data.outputs.version_bump_required != '' && needs.classify-data.outputs.bump_level != '' && needs.classify-data.outputs.bump_basis != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post two-axis PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHELL_CHANGED: ${{ needs.classify-data.outputs.shell_changed }}
          OLD_CONTRACT: ${{ needs.classify-data.outputs.old_contract }}
          NEW_CONTRACT: ${{ needs.classify-data.outputs.new_contract }}
          CONTRACT_ACTION: ${{ needs.classify-data.outputs.contract_action }}
          OLD_VERSION: ${{ needs.classify-data.outputs.old_version }}
          NEW_VERSION: ${{ needs.classify-data.outputs.new_version }}
          VERSION_ACTION: ${{ needs.classify-data.outputs.version_action }}
          OLD_SPA_MIN: ${{ needs.classify-data.outputs.old_spa_min }}
          NEW_SPA_MIN: ${{ needs.classify-data.outputs.new_spa_min }}
          SPA_MIN_ACTION: ${{ needs.classify-data.outputs.spa_min_action }}
          SPA_MIN_PRESENT: ${{ needs.classify-data.outputs.spa_min_present }}
          VERSION_BUMP_REQUIRED: ${{ needs.classify-data.outputs.version_bump_required }}
          BUMP_LEVEL: ${{ needs.classify-data.outputs.bump_level }}
          BUMP_BASIS: ${{ needs.classify-data.outputs.bump_basis }}
        with:
          script: |
            const marker = '<!-- classify-release -->';
            const {
              SHELL_CHANGED,
              OLD_CONTRACT, NEW_CONTRACT, CONTRACT_ACTION,
              OLD_VERSION, NEW_VERSION, VERSION_ACTION,
              OLD_SPA_MIN, NEW_SPA_MIN, SPA_MIN_ACTION, SPA_MIN_PRESENT,
              VERSION_BUMP_REQUIRED,
              BUMP_LEVEL, BUMP_BASIS,
            } = process.env;

            // Revalidate the bounded output contract before using cross-job data.
            const integer = /^(0|[1-9][0-9]{0,8})$/;
            const semver = /^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:[+][0-9A-Za-z.-]+)?$/;
            const enumValue = (value, allowed) => allowed.includes(value);
            if (!['true', 'false'].includes(SHELL_CHANGED) ||
                !integer.test(OLD_CONTRACT) || !integer.test(NEW_CONTRACT) ||
                !enumValue(CONTRACT_ACTION, ['none', 'needed', 'bumped']) ||
                !semver.test(OLD_VERSION) || OLD_VERSION.length > 128 ||
                !semver.test(NEW_VERSION) || NEW_VERSION.length > 128 ||
                !enumValue(VERSION_ACTION, ['none', 'notes-needed', 'bumped']) ||
                !integer.test(OLD_SPA_MIN) || !integer.test(NEW_SPA_MIN) ||
                !enumValue(SPA_MIN_ACTION, ['none', 'raised', 'lowered', 'removed']) ||
                !['true', 'false'].includes(SPA_MIN_PRESENT) ||
                !['true', 'false'].includes(VERSION_BUMP_REQUIRED) ||
                !enumValue(BUMP_LEVEL, ['none', 'patch', 'minor', 'major']) ||
                !enumValue(BUMP_BASIS, ['none', 'breaking', 'added', 'ipc', 'notes', 'shell']) ||
                (BUMP_LEVEL === 'none') !== (BUMP_BASIS === 'none')) return;

            // ── Probe active client version (best-effort) ──────────────────
            // listReleases, NOT getLatestRelease: Concord ships PRE-releases,
            // and GET /releases/latest 404s on a prerelease-only repo (it only
            // returns the latest *full* release). List all, take the most-recent
            // non-draft (prereleases included), and strip the `desktop-v` tag
            // prefix so it compares cleanly against package.json's bare version.
            let activeVersion = 'unknown (probe failed)';
            try {
              const rels = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 30,
              });
              const latest = rels.data.find(r => !r.draft);
              if (latest && latest.tag_name) {
                activeVersion = latest.tag_name.replace(/^desktop-v?/, '').replace(/^v/, '');
              }
            } catch (_err) {
              // network/API error — keep the 'unknown (probe failed)' fallback
            }

            // ── Per-axis "Bump?" cells ─────────────────────────────────────
            const NA = 'unknown (probe failed)';
            let liveContract = NA;
            try {
              const response = await fetch('https://api.concordvoice.chat/api/v1/client/config', {
                signal: AbortSignal.timeout(5000),
              });
              if (response.ok) {
                const config = await response.json();
                if (typeof config.spaIpcContract === 'number' && Number.isSafeInteger(config.spaIpcContract) && config.spaIpcContract >= 0 && config.spaIpcContract <= 999999999) liveContract = String(config.spaIpcContract);
              }
            } catch (_err) {
              // Best-effort public probe; preserve the safe fallback.
            }
            const activeContract = liveContract || NA;

            // ── SPA minimum: the number that actually reaches clients ──────
            // deploy-spa.sh publishes SPA_MIN_CONTRACT as SPA_IPC_CONTRACT, so
            // the live probe above reflects THIS axis, not the capability.
            // Raising it is the only movement that costs anyone the remote SPA.
            let spaMinCell;
            if (VERSION_BUMP_REQUIRED === 'true') {
              spaMinCell = `⛔ **RAISED \`${OLD_SPA_MIN}\`→\`${NEW_SPA_MIN}\` with no version bump** — blocks the SPA deploy`;
            } else if (SPA_MIN_ACTION === 'raised') {
              spaMinCell = `✅ raised \`${OLD_SPA_MIN}\`→\`${NEW_SPA_MIN}\`, client v${NEW_VERSION} ships with it`;
            } else if (SPA_MIN_ACTION === 'lowered') {
              spaMinCell = `✅ lowered \`${OLD_SPA_MIN}\`→\`${NEW_SPA_MIN}\` — admits more shells, always safe`;
            } else {
              spaMinCell = '✅ unchanged — no client loses the remote SPA';
            }

            // NOTHING probes the live capability. `LIVE_CONTRACT` reads
            // `.spaIpcContract` off /api/v1/client/config, which is the published
            // DEMAND — it belongs to the SPA-minimum row alone. Borrowing it here
            // showed one number under two different questions, and once the two
            // diverge (19 vs 25) it reads as the capability having regressed.
            // The old "already on main, awaiting deploy" branch went with it:
            // no deploy publishes the capability, so it was never awaiting one.
            let contractBump;
            if (CONTRACT_ACTION === 'bumped') {
              contractBump = `✅ bumped \`${OLD_CONTRACT}\`→\`${NEW_CONTRACT}\` — free, no client affected`;
            } else if (CONTRACT_ACTION === 'needed') {
              contractBump = `⚠️ **BUMP to \`${Number(NEW_CONTRACT) + 1}\`** in \`src/main/ipcContract.ts\` (shell IPC changed)`;
            } else {
              contractBump = '✅ not needed';
            }

            // Re-read live PR state immediately before publishing. A stale
            // pull_request_target event must never publish classification for a
            // head/base that has since changed or a PR that is no longer open.
            const current = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (current.data.state !== 'open' || current.data.base.ref !== 'main' || current.data.head.sha !== context.payload.pull_request.head.sha || current.data.base.sha !== context.payload.pull_request.base.sha) return;
            if (current.data.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
            const hotfix = current.data.labels.some(l => l.name === 'risk: hotfix');

            let versionBump;
            if (VERSION_ACTION === 'bumped') {
              versionBump = hotfix
                ? `✅ bumped \`${OLD_VERSION}\`→\`${NEW_VERSION}\` → release **v${NEW_VERSION}** on merge`
                : `✅ bumped \`${OLD_VERSION}\`→\`${NEW_VERSION}\` → release **v${NEW_VERSION}** at the next nightly`;
            } else if (VERSION_ACTION === 'notes-needed') {
              // Deliberately does NOT ask for a version bump (#2996). What a
              // shell change OWES is the note; bumping is a separate decision
              // about whether this PR finishes something worth shipping, and
              // most do not. A PR that does decide to cut must carry the bump
              // and the promotion together (verify-changelog.sh Rules 1 and 3)
              // — the remediation block above prints both commands. Naming a
              // bump here would make a deliberate release decision read like a
              // gate requirement.
              // Names BOTH ways to satisfy Rule 4. Saying only "add a note" was
              // wrong for a PR that legitimately carries a `Changelog-Exempt:`
              // trailer: the gate passes, this cell still demanded action, and the
              // top-line verdict still read "action required". Wording, not
              // detection — re-implementing the trailer rule here would be a second
              // copy of it, free to drift from the one that actually gates.
              versionBump = '⚠️ **ADD A NOTE** under `## [Prerelease]` in `CHANGELOG.md`, or a `Changelog-Exempt:` trailer (shell changed)';
            } else if (activeVersion !== NA && activeVersion !== NEW_VERSION) {
              versionBump = `✅ not needed — \`${NEW_VERSION}\` already on \`main\`, awaiting release`;
            } else {
              versionBump = '✅ not needed';
            }

            // ── Recommended bump (release-versioning.md § Bump-level criteria) ──
            // The human decides WHEN to cut; this row says at what level, from
            // what the next release would carry. Pre-1.0, a breaking change ships
            // as a minor (semver §4); 1.0.0 is GA, a deliberate call, never a
            // recommendation.
            // recommend-bump:begin (extracted and exercised by classify-release.test.sh)
            const LEVEL_RANK = { none: 0, patch: 1, minor: 2, major: 3 };
            const BASIS_TEXT = {
              breaking: 'a pending note is marked **BREAKING**',
              added: 'pending notes include Added, Deprecated or Removed entries',
              ipc: 'the shell IPC contract is ahead of the last release',
              notes: 'pending notes are Changed, Fixed or Security only',
              shell: 'the shell changed, no notes yet',
            };
            const [vMaj, vMin, vPat] = OLD_VERSION.split(/[-+]/)[0].split('.').map(Number);
            const nextFor = (level) => {
              if (level === 'major') return vMaj === 0 ? `0.${vMin + 1}.0` : `${vMaj + 1}.0.0`;
              if (level === 'minor') return `${vMaj}.${vMin + 1}.0`;
              return `${vMaj}.${vMin}.${vPat + 1}`;
            };
            // A revert or a prerelease relabel is not a bump: 'none', never a match.
            const appliedLevel = (() => {
              const [nMaj, nMin, nPat] = NEW_VERSION.split(/[-+]/)[0].split('.').map(Number);
              if (nMaj !== vMaj) return nMaj > vMaj ? 'major' : 'none';
              if (nMin !== vMin) return nMin > vMin ? 'minor' : 'none';
              return nPat > vPat ? 'patch' : 'none';
            })();
            let recommendCell = '—';
            let recommendNext = '—';
            if (VERSION_ACTION === 'bumped' && appliedLevel === 'none') {
              recommendCell = `ℹ️ \`${NEW_VERSION}\` is not above \`${OLD_VERSION}\` (revert or prerelease relabel); no recommendation`;
            } else if (BUMP_LEVEL !== 'none') {
              const next = nextFor(BUMP_LEVEL);
              const preOne = BUMP_LEVEL === 'major' && vMaj === 0 ? ' (pre-1.0: a breaking change ships as a minor)' : '';
              recommendNext = `**${BUMP_LEVEL}** → \`${next}\``;
              if (VERSION_ACTION === 'bumped') {
                recommendCell = LEVEL_RANK[appliedLevel] >= LEVEL_RANK[BUMP_LEVEL] || (preOne && appliedLevel === 'minor')
                  ? `✅ ${appliedLevel} bump matches — ${BASIS_TEXT[BUMP_BASIS]}`
                  : `⚠️ **this PR bumps ${appliedLevel}; criteria say ${BUMP_LEVEL}** (\`${next}\`) — ${BASIS_TEXT[BUMP_BASIS]}${preOne}`;
              } else {
                recommendCell = `💡 ${BASIS_TEXT[BUMP_BASIS]}${preOne}. Your call when to cut: \`./.github/scripts/promote-unreleased-changelog.sh ${next}\` then \`npm version ${next} --no-git-tag-version\` in \`desktop\``;
              }
            }
            // recommend-bump:end

            // ── Release-timing axis (#risk-hotfix) ─────────────────────────
            // The latest label state is read from the live PR immediately before
            // publishing; main-ci still makes the authoritative merge-time decision.
            const timingRow = hotfix
              ? '`risk: hotfix` — releases on merge, bypassing the nightly (and its blocking-red gate)'
              : 'standard — releases in the 07:00 UTC nightly consolidation run';

            // ── Top-line verdict (the at-a-glance answer) ──────────────────
            const needs = CONTRACT_ACTION === 'needed' || VERSION_ACTION === 'notes-needed';
            let verdictTitle, verdictLine;
            if (VERSION_BUMP_REQUIRED === 'true') {
              verdictTitle = '⛔ Blocked — SPA minimum raised without a client';
              verdictLine =
                `\`SPA_MIN_CONTRACT\` moved ${OLD_SPA_MIN}→${NEW_SPA_MIN}, so every shell below ` +
                `${NEW_SPA_MIN} would fall back to its bundled renderer. Either guard the renderer ` +
                'call and lower it back, or ship the client in this PR. See the failing ' +
                '**SPA minimum ships with its client** check for the exact commands.';
            } else if (needs) {
              verdictTitle = '⚠️ Action required before merge';
              verdictLine = 'Something is missing before merge — see the **Bump?** column.';
            } else if (VERSION_ACTION === 'bumped') {
              verdictTitle = hotfix
                ? `✅ Ready — desktop release v${NEW_VERSION} on merge`
                : `✅ Ready — desktop release v${NEW_VERSION} at the next nightly`;
              verdictLine = hotfix
                ? 'The `risk: hotfix` label makes `main-ci.yml` dispatch the signed build on merge.'
                : 'Merging arms the release; `nightly-ci.yml` dispatches the signed build on its next run. Add `risk: hotfix` to cut it on merge instead.';
            } else if (CONTRACT_ACTION === 'bumped') {
              verdictTitle = '✅ Ready — IPC contract bumped';
              verdictLine = 'Contract bump present; no client release needed.';
            } else {
              // Catch-all for "nothing needs bumping", which is NOT the same as
              // "renderer-only". This workflow also runs on build-desktop.yml and
              // on itself, so the branch fires for workflow and tooling edits that
              // ship no artifact at all — and telling their author the change
              // "auto-deploys to Cloudflare Pages" is simply false. State the part
              // that is certain, and make the deploy claim conditional on the case
              // it actually describes.
              verdictTitle = '✅ No action required';
              verdictLine = 'No contract or version bump needed. A renderer-only change auto-deploys to Cloudflare Pages on merge; a workflow or tooling edit ships nothing.';
            }

            // ── Assemble comment body ──────────────────────────────────────
            const body = [
              marker,
              `## 📦 Release Classification — ${verdictTitle}`,
              '',
              verdictLine,
              '',
              '| Axis | Live in prod | This branch | Bump? |',
              '|------|--------------|-------------|-------|',
              `| **IPC Contract** | \`not probed\` | \`${NEW_CONTRACT}\` | ${contractBump} |`,
              `| **Client Version** | \`${activeVersion}\` | \`${NEW_VERSION}\` | ${versionBump} |`,
              `| **SPA minimum** | \`${activeContract}\` | \`${NEW_SPA_MIN}\` | ${spaMinCell} |`,
              `| **Recommended bump** | \`${activeVersion}\` | ${recommendNext} | ${recommendCell} |`,
              `| **Release timing** | — | ${timingRow} | ${hotfix ? '⚡ urgent' : '—'} |`,
              '',
              '<sub>**IPC Contract** = what this shell IMPLEMENTS (`IPC_CONTRACT_VERSION`). Raising it is free — no client is affected. **SPA minimum** = what the deployed renderer DEMANDS (`SPA_MIN_CONTRACT`); this is the number `deploy-spa.sh` publishes and `spaLoader.ts` compares against, so every point it sits above an installed shell is a client on its bundled renderer. Raise it only when the renderer genuinely cannot degrade — guarding the call (`electron?.foo?.()`) is nearly always cheaper than the release it forces. **Client Version** (`desktop/package.json`): what a shell change OWES is an entry under `## [Prerelease]` — bumping is a separate decision about whether this PR finishes something worth shipping. Nothing cuts a release without a bump on `main`, so when the answer is yes, run the promoter and `npm version` in this PR (both commands travel together; Rules 1 and 3). **Recommended bump** = the level the next release carries, diagnosed from the pending CHANGELOG section and the IPC contract against the last release (`docs/policies/release-versioning.md` § Bump-level criteria); when to cut stays your call. **Note:** If a build-workflow edit does not alter any shipped desktop artifact across Windows, macOS, or Linux, nor the IPC contract, no bump is needed — disposition explicitly. **Live in prod** = live `/api/v1/client/config` contract probe + latest published release tag (prereleases included).</sub>',
            ].join('\n');

            // ── Find and update existing comment, or create a new one ──────
            // Paginate to handle PRs with >30 comments
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
