# see provision-secrets.yml
on: push
jobs:
  a:
    uses: ./.github/workflows/x.yml
    secrets: inherit
  b:
    runs-on: ubuntu-latest
    env:
      A: ${{ secrets.ALPHA }}
      B: ${{ secrets['BRAVO'] }}
      C: ${{ secrets[ "CHARLIE" ] }}
    steps:
      - run: echo "${{ secrets.GITHUB_TOKEN }} secrets.NOT_EXPR"
  c:
    uses: ./.github/workflows/y.yml
    with:
      x: ${{ format('{0}}', secrets.DELTA) }}
      y: >-
        ${{
          secrets.ECHO
        }}
      z: ${{ toJSON(secrets) }}
      u: ${{ SECRETS.foxtrot }}
      v: ${{ Secrets['Golf'] }}
  d:
    uses: ./.github/workflows/z.yml
    with:
      w: ${{ toJSON(SECRETS) }}
      bare: ${{ secrets }}
      notsecret: ${{ my_secrets.HOTEL }}
