sonar.projectKey=Concord-Voice_Desktop
sonar.organization=concord-voice

# ── Narrowed scope (ADR-0017 / #1430) ────────────────────────────────────────
# SonarCloud owns COVERAGE + NEW-CODE QUALITY + AI-CODE-ASSURANCE only.
# Security-taint detection (injection-tagged vulnerability rules) is owned by
# CodeQL security-extended (codeql.yml, #1424) + Semgrep (semgrep.yml, #1426);
# the corresponding Sonar sensors are retired via quality-PROFILE deactivation
# (scripts/sonar/narrow-security-profiles.sh) — there is no scanner property
# for this, so nothing below configures it. Do NOT add rule-tuning properties
# here: prohibited by the AI-Code-Assurance policy (CLAUDE.md).

# ── Source & Test Directories ────────────────────────────────────────────────
sonar.sources=desktop/src,tools/concord-bridge/src
sonar.tests=desktop/tests,tools/concord-bridge/tests

# ── TypeScript Projects ──────────────────────────────────────────────────────
# List the concrete per-project configs that own sources (desktop main/preload
# keep their Node configs). Each is in SUPPORT in
# scripts/sonar/prepare-protected-pr-analysis.py, so it also exists in the
# protected PR analysis tree.
sonar.typescript.tsconfigPaths=desktop/tsconfig.json,desktop/tsconfig.main.json,desktop/tsconfig.preload.json,tools/concord-bridge/tsconfig.json

# ── Coverage Reports ─────────────────────────────────────────────────────────
# Generated by parallel CI jobs, downloaded as artifacts before scan
sonar.javascript.lcov.reportPaths=desktop/coverage/lcov.info,tools/concord-bridge/coverage/lcov.info

# ── Source Exclusions (completely ignored by all analysis) ────────────────────
# sensor reads every indexed file as UTF-8 and raised "Invalid character encountered"
# WARNs (the UI-visible "problems with file encoding" analysis warning).
# *.sql: every SQL file here is PostgreSQL (migrations + test bootstrap scripts),
# but the scanner assigns .sql to the Oracle PL/SQL analyzer, which raised the
# "Data Dictionary is not configured" analysis warning. Wrong-language scoping,
# not rule tuning: no rule or quality profile changes.
sonar.exclusions=\
  **/*.sql,\
  **/node_modules/**,\
  **/dist/**,\
  **/out/**,\
  **/*.woff2,\
  **/*.otf,\
  **/data/emoji/*.json,\
  **/tests/benchmarks/**

# ── Coverage Exclusions (not counted toward coverage metrics) ────────────────
# Test files and helpers
sonar.coverage.exclusions=\
  **/testdata/**,\
  **/tests/benchmarks/**,\
  **/data/emoji/**,\
  desktop/src/main/**,\
  desktop/src/preload/**,\
  desktop/src/renderer/main.tsx,\
  desktop/src/renderer/workers/e2eeWorker.ts,\
  desktop/src/renderer/components/DirectMessages/FriendsFlexSpace.tsx

# ── Duplication Exclusions (not counted toward duplication metrics) ───────────
sonar.cpd.exclusions=\
  **/tests/**
