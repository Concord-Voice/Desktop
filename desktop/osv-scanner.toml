[[IgnoredVulns]]
id = "CVE-2026-103387"
ignoreUntil = 2027-01-29T00:00:00Z
reason = "uri-js 4.4.1, dev-only via ajv@6 under eslint 10 and roarr. ajv 6 resolves URIs only in schemas that ship inside those packages, never in user data. No fixed release: uri-js is unmaintained and 4.4.1 is the latest. Recorded pre-emptively by maintainer decision (SonarCloud reports it; OSV and npm audit did not on 2026-11-18). Scoped to this id so unreviewed advisories still surface."

